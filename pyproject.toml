[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perfusion"
version = "0.1.0"
description = "Syringe-pump math and perfusion scripts for in-vitro rigs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dylan Stechmann"}]
dependencies = []

[project.scripts]
perfusion = "perfusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
